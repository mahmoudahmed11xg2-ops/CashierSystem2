<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>شاشة المطبخ — KDS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#0f172a;color:#e5e7eb}
header{height:64px;background:#111827;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#94a3b8;margin-top:4px}
.actions{display:flex;gap:8px}.btn{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700}.btn:hover{background:#334155}
main{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:#1e293b;border:1px solid #475569;border-radius:12px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
.table{font-size:18px;font-weight:800}.round{font-size:12px;color:#cbd5e1}.time{font-size:12px;color:#94a3b8;margin-top:3px}
.items{padding:12px 14px;min-height:100px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #475569}.item:last-child{border-bottom:0}.qty{font-weight:900;min-width:35px}
.note{margin-top:8px;color:#fbbf24;font-size:12px}.foot{padding:10px 14px;border-top:1px solid #334155;display:flex;gap:7px}.status{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#fef3c7;color:#92400e}.empty{grid-column:1/-1;text-align:center;padding:70px;color:#94a3b8}
</style>
</head>
<body>
<header>
<div><h1>👨‍🍳 شاشة المطبخ</h1><div class="sub">الـ Rounds المرسلة من الكاشير — لا يتم إغلاق الطاولة من هنا</div></div>
<div class="actions"><button class="btn" onclick="location.href='pos.html'">الكاشير</button><button class="btn" onclick="render()">تحديث</button></div>
</header>
<main id="kds"></main>
<script type="module">
import AuthService,{TableManager,TABLE_STATUS} from './auth.js';
import DataService from './js/dataService.js';
await DataService.init(['tables']);
if(!AuthService.enforcePage('kitchen.html')){}
const kds=document.getElementById('kds');

function render(){
  const tables=TableManager.getTables();
  const cards=[];
  tables.filter(t=>t.status===TABLE_STATUS.OCCUPIED && t.currentSession).forEach(t=>{
    (t.currentSession.rounds||[]).forEach(r=>{
      const status=r.kitchenStatus||'new';
      if(status==='served') return;
      cards.push({t,r,status});
    });
  });
  cards.sort((a,b)=>new Date(a.r.sentToKitchenAt||0)-new Date(b.r.sentToKitchenAt||0));
  if(!cards.length){kds.innerHTML='<div class="empty">لا توجد طلبات جديدة أو قيد التحضير حالياً 🍽️</div>';return;}
  kds.innerHTML=cards.map(({t,r,status})=>{
    const statusText=status==='preparing'?'قيد التحضير':'جديد';
    const next=status==='new'?'preparing':'served';
    const nextText=status==='new'?'بدء التحضير':'تم التسليم';
    return `<section class="card">
      <div class="head"><div><div class="table">طاولة ${t.number}</div><div class="round">Round #${r.roundNumber}</div><div class="time">${r.time||'—'}</div></div><span class="status">${statusText}</span></div>
      <div class="items">${(r.items||[]).map(it=>`<div class="item"><span>${it.name}${it.note?`<div class="note">ملاحظة: ${it.note}</div>`:''}</span><span class="qty">× ${it.qty}</span></div>`).join('')}</div>
      <div class="foot"><button class="btn" style="flex:1" onclick="updateRound('${t.id}',${r.roundNumber},'${next}')">${nextText}</button></div>
    </section>`;
  }).join('');
}
window.updateRound=async function(tableId,roundNumber,status){
  try{TableManager.updateRoundStatus(tableId,roundNumber,status);render();}catch(e){alert(e.message);}
};
DataService.on(['tables'],render);
render();
setInterval(render,3000);
</script>
</body>
</html>
